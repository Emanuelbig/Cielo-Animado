<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cielo animado</title>
<style>
  html, body { margin: 0; height: 100%; background: #c9cdf2; overflow: hidden; }
  #cielo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .contenido {
    position: relative; z-index: 1; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif; color: #111; text-align: center; padding: 0 16px;
  }
  h1 { font-size: clamp(28px, 5vw, 56px); font-weight: 500; margin: 0 0 12px; }
  p  { margin: 0; opacity: .75; }
</style>
</head>
<body>
<canvas id="cielo"></canvas>
<div class="contenido">
  <h1>Tu título acá</h1>
  <p>Fondo de cielo animado con WebGL</p>
</div>

<script>
const canvas = document.getElementById('cielo');
const gl = canvas.getContext('webgl');

const vert = `
attribute vec2 p;
void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

const frag = `
precision highp float;
uniform vec2  uRes;
uniform float uTime;

// Ruido de valor + fBm: la base de las nubes
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), u.x),
             mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  mat2 r = mat2(0.8, -0.6, 0.6, 0.8);
  for(int i = 0; i < 6; i++){ v += a * noise(p); p = r * p * 2.0; a *= 0.5; }
  return v;
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p  = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;
  float t = uTime * 0.03;

  // Domain warping: deforma las coordenadas con otro ruido -> formas "algodonosas"
  vec2 q = vec2(fbm(p*1.5 + vec2(0.0, t)), fbm(p*1.5 + vec2(5.2, -t)));
  vec2 r = vec2(fbm(p*1.5 + 2.0*q + vec2(1.7, 9.2) + t*0.7),
                fbm(p*1.5 + 2.0*q + vec2(8.3, 2.8) - t*0.5));
  float n = fbm(p*1.2 + 2.5*r);

  // Paleta: azul cielo -> lavanda -> blanco luminoso
  vec3 azul    = vec3(0.55, 0.62, 0.95);
  vec3 lavanda = vec3(0.78, 0.74, 0.97);
  vec3 blanco  = vec3(0.98, 0.97, 1.00);

  vec3 col = mix(azul, lavanda, smoothstep(0.0, 1.0, uv.y + 0.3*q.x));
  col = mix(col, blanco, smoothstep(0.45, 0.85, n));
  col += 0.06 * vec3(1.0, 0.85, 0.95) * smoothstep(0.6, 1.0, r.y); // toque rosado

  // Brillo arriba al centro, como el sol detrás de las nubes
  col += 0.12 * exp(-3.0 * length(p - vec2(0.0, 0.45)));

  // Grano sutil para evitar el "banding" de los degradados
  col += (hash(gl_FragCoord.xy + uTime) - 0.5) * 0.015;

  gl_FragColor = vec4(col, 1.0);
}`;

function shader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, vert));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, frag));
gl.linkProgram(prog);
gl.useProgram(prog);

// Un triángulo gigante que cubre toda la pantalla
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uRes  = gl.getUniformLocation(prog, 'uRes');
const uTime = gl.getUniformLocation(prog, 'uTime');

// Renderiza a menor resolución: las nubes son borrosas, no hace falta full-res
const ESCALA = 0.5;
function resize(){
  canvas.width  = innerWidth  * ESCALA;
  canvas.height = innerHeight * ESCALA;
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(uRes, canvas.width, canvas.height);
}
addEventListener('resize', resize);
resize();

const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(ms){
  gl.uniform1f(uTime, quieto ? 20 : ms / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (!quieto) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
